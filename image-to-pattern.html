<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashionDesigner | 画像から形状データ</title><style>body{margin:0;background:#f5f3f7;color:#282334;font:15px system-ui}header{background:#272335;color:white;padding:16px}main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:270px 1fr;gap:16px}section{background:white;border-radius:12px;padding:16px}button,input{font:inherit}button{background:#594272;color:white;border:0;border-radius:8px;padding:10px;margin:5px;cursor:pointer}canvas{width:100%;height:auto;max-height:70vh;object-fit:contain;border:1px solid #ddd;touch-action:none}label{display:block;margin:12px 0}small{color:#666}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><strong>FashionDesigner / 画像 → 形状データ</strong></header><main><section><h2>画像から輪郭を取得</h2><label>画像 <input id="file" type="file" accept="image/*"></label><label>背景との差の閾値 <input id="threshold" type="range" min="10" max="200" value="65"></label><button id="extract">輪郭を自動抽出</button><button id="clear">点を消去</button><p><small>画像を読み込んで輪郭を自動抽出できます。プレビュー上をタップすると点を追加、点の近くをタップすると削除できます。画像背景が単色の場合に適しています。</small></p><h3>形状の再利用</h3><button id="svg">SVG図面</button><button id="json">JSON保存</button><label>JSON読み込み <input id="import" type="file" accept=".json,application/json"></label><button id="preview3d">簡易3Dプレビュー</button><p id="status" role="status" aria-live="polite"></p><small>これは輪郭をベクトル化する試作です。縫い代・寸法・前後パーツ・生地物性を復元する製造用型紙ではありません。3Dは輪郭の厚み付き押し出し表示で、衣服の着装シミュレーションではありません。</small></section><section><canvas id="view" width="700" height="700" aria-label="画像と輪郭プレビュー"></canvas></section></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let img=null,points=[],mode3d=false;
const W=700,H=700;function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#faf9fc';ctx.fillRect(0,0,W,H);if(img&&!mode3d)ctx.drawImage(img,0,0,W,H);if(points.length){ctx.strokeStyle='#e02682';ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(...p));if(points.length>2)ctx.closePath();ctx.stroke();if(mode3d){const depth=45;ctx.fillStyle='#a783c6';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0]+depth,p[1]-depth):ctx.moveTo(p[0]+depth,p[1]-depth));ctx.closePath();ctx.fill();ctx.fillStyle='#62467f';for(let i=0;i<points.length;i++){const p=points[i],q=points[(i+1)%points.length];ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.lineTo(q[0]+depth,q[1]-depth);ctx.lineTo(p[0]+depth,p[1]-depth);ctx.closePath();ctx.fill();}ctx.fillStyle='#d8b8ed';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();}else{ctx.fillStyle='#e02682';points.forEach(p=>{ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill()})}}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),image=new Image();image.onload=()=>{img=image;points=[];mode3d=false;draw();URL.revokeObjectURL(url)};image.onerror=()=>{$('status').textContent='画像を読み込めませんでした';URL.revokeObjectURL(url)};image.src=url};
function extract(){if(!img){$('status').textContent='画像を選択してください';return}const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='white';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data,idx=(px,py)=>(py*W+px)*4;const corners=[[0,0],[W-1,0],[0,H-1],[W-1,H-1]];const bg=[0,1,2].map(k=>corners.reduce((s,p)=>s+d[idx(...p)+k],0)/4);const t=Number($('threshold').value),mask=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){let i=idx(xx,y),dist=Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);mask[y*W+xx]=dist>t?1:0}let best=[],visited=new Uint8Array(W*H);for(let y=0;y<H;y+=2)for(let xx=0;xx<W;xx+=2){let seed=y*W+xx;if(!mask[seed]||visited[seed])continue;let stack=[seed],component=[],minx=W,maxx=0,miny=H,maxy=0;visited[seed]=1;while(stack.length){const p=stack.pop(),px=p%W,py=Math.floor(p/W);component.push(p);minx=Math.min(minx,px);maxx=Math.max(maxx,px);miny=Math.min(miny,py);maxy=Math.max(maxy,py);for(const n of [p-1,p+1,p-W,p+W]){if(n<0||n>=W*H||visited[n]||!mask[n])continue;const nx=n%W;if(Math.abs(nx-px)>1)continue;visited[n]=1;stack.push(n)}}if(component.length>best.length)best=component}if(best.length<80){$('status').textContent='輪郭が見つかりません。背景や閾値を確認してください';return}const set=new Set(best),boundary=[];for(const p of best){const xx=p%W,y=Math.floor(p/W);if(xx===0||xx===W-1||y===0||y===H-1||!set.has(p-1)||!set.has(p+1)||!set.has(p-W)||!set.has(p+W))boundary.push([xx,y])}const cx=boundary.reduce((s,p)=>s+p[0],0)/boundary.length,cy=boundary.reduce((s,p)=>s+p[1],0)/boundary.length;boundary.sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));points=boundary.filter((_,i)=>i%Math.max(1,Math.floor(boundary.length/100))===0);mode3d=false;draw();$('status').textContent='輪郭候補を抽出しました（'+points.length+'点）。複雑な凹形状は手動修正が必要です。'}
$('extract').onclick=extract;$('clear').onclick=()=>{points=[];mode3d=false;draw()};canvas.addEventListener('click',e=>{if(mode3d)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const i=points.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)<12);if(i>=0)points.splice(i,1);else points.push([Math.round(x),Math.round(y)]);draw()});
function download(name,type,data){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('svg').onclick=()=>{if(points.length<3)return;const d=points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')+' Z';download('fashion-shape.svg','image/svg+xml',`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700"><path d="${d}" fill="none" stroke="black" stroke-width="2"/></svg>`)};
$('json').onclick=()=>{if(points.length<3)return;download('fashion-shape.json','application/json',JSON.stringify({schema:'fashiondesigner.shape.v1',width:W,height:H,units:'px',points},null,2))};
$('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.schema!=='fashiondesigner.shape.v1'||!Array.isArray(data.points)||data.points.length>10000||!data.points.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&Number.isFinite(n))))throw Error();points=data.points;mode3d=false;draw();$('status').textContent='形状を読み込みました'}catch{$('status').textContent='対応する形状JSONではありません'}};
$('preview3d').onclick=()=>{if(points.length<3){$('status').textContent='輪郭を先に作成してください';return}mode3d=!mode3d;draw()};draw();
</script></body></html>
