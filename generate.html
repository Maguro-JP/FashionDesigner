<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashionDesigner AI画像生成</title><style>body{font:16px system-ui;max-width:850px;margin:24px auto;padding:16px;background:#f6f4f8}textarea{width:100%;height:100px}button{background:#593c78;color:white;padding:12px;border:0;border-radius:8px}img{display:block;max-width:100%;max-height:500px;margin:16px auto}</style><h1>FashionDesigner — AI画像生成</h1><p>画像生成APIを設定したローカルサーバーから服を生成し、FashionDesigner Studioに渡します。</p><textarea id="prompt" placeholder="例：紺色のパフスリーブワンピース"></textarea><p><button id="go">画像を生成</button> <button id="open" disabled>Studioへ送る</button></p><p id="status" role="status">生成にはローカルサーバーと画像生成APIの設定が必要です。</p><img id="preview" alt="生成された衣服画像"><script>
let generated=null;const $=id=>document.getElementById(id);
$('go').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt){$('status').textContent='服の説明を入力してください';return}$('go').disabled=true;$('open').disabled=true;$('status').textContent='画像生成中…';try{const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const json=await res.json();if(!res.ok)throw Error(json.error||'画像生成失敗');generated=json.image;$('preview').src=generated;$('open').disabled=false;$('status').textContent='画像を生成しました。Studioに送って輪郭抽出してください。'}catch(e){$('status').textContent='生成できませんでした: '+e.message}finally{$('go').disabled=false}};
$('open').onclick=()=>{if(!generated)return;try{sessionStorage.setItem('fashiondesigner.generatedImage',generated);location.href='./studio.html'}catch(e){$('status').textContent='画像が大きすぎて転送できません: '+e.message}};
</script></html>
