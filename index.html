<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashionDesigner</title>
<style>
:root{font-family:system-ui,sans-serif;color:#252331;background:#f5f3f7}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:#272335;color:white}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;max-width:1100px;margin:auto}.panel,.stage{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px #0001}label{display:block;margin:14px 0 6px;font-weight:600}select,input,button{font:inherit}select,input[type=color]{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}button{border:0;border-radius:8px;background:#56416e;color:white;padding:10px 14px;cursor:pointer;margin:6px 4px 0 0}button.secondary{background:#eae5ee;color:#272335}.stage{text-align:center}canvas{width:100%;max-width:560px;height:auto;border:1px solid #e3dfe8;border-radius:8px;touch-action:none}p{font-size:13px;color:#666}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}.panel,.stage{padding:14px}}
</style></head><body><header><h1>FashionDesigner — デザインスタジオ</h1></header><div style="padding:14px;text-align:center;background:#e8e0f1"><a href="./studio.html" style="font-weight:bold;color:#39244d">画像から図面・3D形状を作成するスタジオを開く →</a></div><main><section class="panel"><h2>デザイン設定</h2><label for="item">アイテム</label><select id="item"><option value="shirt">トップス</option><option value="dress">ワンピース</option><option value="skirt">スカート</option><option value="pants">パンツ</option></select><label for="color">生地カラー</label><input id="color" type="color" value="#b68acb"><label for="accent">アクセントカラー</label><input id="accent" type="color" value="#5b3c75"><label for="name">デザイン名</label><input id="name" maxlength="80" value="My Design"><div><button id="save">保存</button><button id="export">PNG出力</button><button id="reset" class="secondary">初期化</button></div><p>ブラウザ内にデザイン設定を保存します。アカウントやサーバーへの送信はありません。</p><p id="status" role="status" aria-live="polite"></p></section><section class="stage"><canvas id="canvas" width="600" height="720" aria-label="服のデザインプレビュー"></canvas></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const fields=['item','color','accent','name'];const defaults={item:'shirt',color:'#b68acb',accent:'#5b3c75',name:'My Design'};
function path(points){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
function draw(){const item=$('item').value,c=$('color').value,a=$('accent').value;ctx.clearRect(0,0,600,720);ctx.fillStyle='#faf8fb';ctx.fillRect(0,0,600,720);ctx.strokeStyle='#ddd5e4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(300,90);ctx.lineTo(300,640);ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle=a;ctx.fillStyle=c;
const shapes={shirt:[[230,165],[265,145],[280,175],[320,175],[335,145],[370,165],[440,245],[398,288],[360,255],[360,500],[240,500],[240,255],[202,288],[160,245]],dress:[[230,165],[265,145],[280,175],[320,175],[335,145],[370,165],[420,240],[385,275],[365,245],[390,540],[210,540],[235,245],[215,275],[180,240]],skirt:[[245,250],[355,250],[410,520],[190,520]],pants:[[240,230],[360,230],[375,530],[315,530],[300,350],[285,530],[225,530]]};path(shapes[item]);ctx.fill();ctx.stroke();ctx.strokeStyle=a;ctx.lineWidth=8;ctx.beginPath();if(item==='shirt'||item==='dress'){ctx.moveTo(280,175);ctx.quadraticCurveTo(300,215,320,175)}else{ctx.moveTo(245,item==='skirt'?265:245);ctx.lineTo(355,item==='skirt'?265:245)}ctx.stroke();ctx.fillStyle='#292332';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText($('name').value||'Untitled',300,625);ctx.font='16px system-ui';ctx.fillText('FashionDesigner',300,660);}
function snapshot(){return Object.fromEntries(fields.map(k=>[k,$(k).value]));}
function restore(s){for(const k of fields){if(typeof s[k]==='string')$(k).value=s[k]}draw();}
for(const k of fields)$(k).addEventListener('input',draw);
$('save').onclick=()=>{try{localStorage.setItem('fashiondesigner:v1',JSON.stringify(snapshot()));$('status').textContent='保存しました。'}catch{$('status').textContent='保存できませんでした。'}};
$('reset').onclick=()=>{restore(defaults);$('status').textContent='初期化しました。'};
$('export').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='fashion-design.png';a.click();};
try{const saved=localStorage.getItem('fashiondesigner:v1');if(saved)restore({...defaults,...JSON.parse(saved)});else draw()}catch{draw()}
</script></body></html>
