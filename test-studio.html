<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashionDesigner 実機テスト</title><style>body{font:15px system-ui;margin:20px;background:#f7f5f9}iframe{width:100%;height:520px;border:1px solid #bbb}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:8px}button{padding:12px;background:#59416f;color:white;border:0;border-radius:8px}</style><h1>FashionDesigner ブラウザ統合テスト</h1><p>下の実際のstudio.htmlを操作して、SVG・JSON・OBJの生成結果を検査します。</p><button id="run">テスト実行</button><pre id="log">未実行</pre><iframe id="app" src="./studio.html"></iframe><script>
const log=document.querySelector('#log'),frame=document.querySelector('#app');document.querySelector('#run').onclick=async()=>{const w=frame.contentWindow,d=w.document;let results=[],captured=[];const oldBlob=w.Blob,oldClick=w.HTMLAnchorElement.prototype.click;try{w.Blob=function(parts,opts){const b=new oldBlob(parts,opts);captured.push({parts,type:opts?.type});return b};w.Blob.prototype=oldBlob.prototype;w.HTMLAnchorElement.prototype.click=function(){};function check(label,condition){results.push((condition?'PASS':'FAIL')+' '+label)}d.querySelector('#sample').click();check('画像テンプレート生成',!!d.querySelector('#canvas').getContext('2d').getImageData(320,300,1,1).data[3]);d.querySelector('#trace').click();const message=d.querySelector('#status').textContent;check('輪郭抽出',message.includes('閉じた輪郭を抽出しました'));d.querySelector('#svg').click();d.querySelector('#json').click();d.querySelector('#obj').click();const contents=captured.map(c=>c.parts.join(''));const svg=contents.find(c=>c.includes('<svg')),json=contents.find(c=>c.includes('fashiondesigner.shape.v2')),obj=contents.find(c=>c.includes('# FashionDesigner extrusion OBJ'));check('SVG図面を生成',!!svg&&svg.includes('<path'));check('JSON形状データを生成',!!json&&JSON.parse(json).points.length>=3);check('OBJメッシュを生成',!!obj&&obj.includes('\nv ')&&obj.includes('\nf '));if(obj){const lines=obj.split('\n'),nv=lines.filter(x=>x.startsWith('v ')).length,nf=lines.filter(x=>x.startsWith('f ')).length;check('OBJに頂点と面が存在',nv>=6&&nf>=5)}log.textContent=results.join('\n')+'\n\n'+message+'\n出力Blob数: '+captured.length}catch(e){log.textContent=results.join('\n')+'\nERROR '+e.stack}finally{w.Blob=oldBlob;w.HTMLAnchorElement.prototype.click=oldClick}};
</script>
